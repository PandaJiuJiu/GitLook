# Gitlook 容器内配置。
#
# 与仓库根目录的 config.toml 分开：那份是本机开发用的，指向 tmp/ 下的目录；
# 这份是容器部署用的，指向挂载进来的数据卷。
#
# 注意所有路径都是容器内路径，不是宿主机路径。

[server]
# 容器内绑定所有接口是必须的（否则端口映射进来的流量到不了）。
# 宿主机上暴露到什么范围，由 compose.yml 的 ports 决定，与这里无关。
host = "0.0.0.0"
port = 9999
base_path = ""
max_body_size = 104857600
request_timeout_secs = 300
# 挂载进来的，所以改完立刻生效，不需要重���容器（服务按 mtime 判断是否重读）
howto_file = "/etc/gitlook/docs/HOWTO.md"
# 首页 footer 里的 GitHub 链接
github_url = "https://github.com/PandaJiuJiu/GitLook"

[git]
repos_dir = "/var/lib/gitlook/repos"
worktrees_dir = "/var/lib/gitlook/worktrees"
default_branch = "main"
# 创建仓库时把这个脚本拷进 <repo>.git/hooks/post-receive
hook_template = "/etc/gitlook/hooks/post-receive"
# SQLite 数据库（用户 + session）
db_path = "/var/lib/gitlook/gitlook.db"

[static_files]
auto_index = true
index_template = "/etc/gitlook/templates/dir_index.html.tera"
home_template = "/etc/gitlook/templates/home.html.tera"
setup_template = "/etc/gitlook/templates/setup.html.tera"
login_template = "/etc/gitlook/templates/login.html.tera"
admin_template = "/etc/gitlook/templates/admin.html.tera"
spa_fallback = false
cache_max_age = 3600

[webhook]
enabled = false
secret = ""
allowed_events = ["push"]

[logging]
level = "info"
json_format = false
