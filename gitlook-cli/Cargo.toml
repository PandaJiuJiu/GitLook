[package]
name = "gitlook-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for managing gitlook repositories"

[dependencies]
gitlook-server = { path = "../gitlook-server" }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console = "0.15"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"