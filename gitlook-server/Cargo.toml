[package]
name = "gitlook-server"
version = "0.1.0"
edition = "2021"
description = "Gitlook HTTP server with Git push deployment"

[dependencies]
# HTTP Server
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-br"] }
hyper = { version = "1.1", features = ["full"] }
http = "1.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Git operations - 通过 std::process::Command 调用 git 命令行。
# 不用 git2：git2::Repository 包装 *mut git_repository，既非 Send 也非 Sync，
# 引用无法跨 .await，所以 axum handler 里根本编译不过。CLI 开销约 1ms，
# 相对一次 HTTP 请求可忽略，还省掉了 libgit2 的 C 依赖。

# Template engine for directory indexing
tera = "1.19"

# Auth: SQLite for users/sessions, argon2 for password hashing, rand for session tokens.
# rusqlite 用 bundled feature：自包含 libsqlite3，镜像里无需装 libsqlite3-dev。
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
base64 = { version = "0.22", features = ["std"] }

# Async file operations
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2.0"
percent-encoding = "2.3"
kstring = "1.0"
dirs = "5.0"

# Compression
flate2 = "1.0"
zstd = "0.13"

# Temp file
tempfile = "3.10"

[dev-dependencies]
tempfile = "3.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }